
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lems-backend

  datasource:
    url: jdbc:mysql://localhost:3306/lems?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: lems
    password: "lems"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lems.entity
  configuration:
    map-underscore-to-camel-case: true
